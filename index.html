<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Singapore TOTO results since 2008: the latest draw, 1,892 draws of history, number stats, number-picking strategies scored against random picks, and a number board with a line builder."
        />
        <meta name="theme-color" content="#041018" />
        <meta property="og:title" content="Singapore TOTO results, history, stats & strategy rules" />
        <meta
            property="og:description"
            content="Latest TOTO result, 1,892 draws of history, number stats, and number-picking strategies scored against random picks."
        />
        <meta property="og:type" content="website" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <!-- Non-blocking font CSS: the print-media trick loads the sheet at the
             lowest priority, then swaps it to all — first paint never waits on
             the third-party origin (Lighthouse: render-blocking requests). -->
        <link
            rel="preload"
            href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Sora:wght@500;600;700&display=swap"
            as="style"
        />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Sora:wght@500;600;700&display=swap"
            media="print"
            onload="this.media='all'"
        />
        <noscript>
            <link
                rel="stylesheet"
                href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Sora:wght@500;600;700&display=swap"
            />
        </noscript>
        <!-- Agentic Resource Discovery: the catalog this site publishes. -->
        <link rel="ard" href="https://toto.tingting.vip/ai-catalog.json" />

        <!-- Pin an explicit theme choice before the first paint; without a stored
             choice the page follows the operating system through `color-scheme`. -->
        <script>
            (function () {
                try {
                    var stored = localStorage.getItem("toto-theme");
                    if (stored === "light" || stored === "dark") {
                        document.documentElement.dataset.theme = stored;
                    } else {
                        document.documentElement.dataset.theme = "dark";
                    }
                } catch (error) {
                    /* Private mode: fall back to the system scheme. */
                }
            })();
        </script>

        <title>Singapore TOTO results, history, stats &amp; strategy rules</title>
    </head>

    <body class="size-full bg-canvas text-ink antialiased">
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>

<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Singapore TOTO draws since 2008: latest result, full draw history, statistical insights, a 204-strategy league measured against chance, and the number heat board with its line builder."
        />
        <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F3F2FA" />
        <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E1022" />
        <meta property="og:title" content="toto.sg — Singapore TOTO draws, 204-strategy league & insights" />
        <meta
            property="og:description"
            content="Latest TOTO result, 1,892 draws of history, statistical insights, and a walk-forward league of 204 number-picking strategies scored against chance."
        />
        <meta property="og:type" content="website" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Sora:wght@500;600;700&display=swap"
            rel="stylesheet"
        />

        <!-- Pin an explicit theme choice before the first paint; without a stored
             choice the page follows the operating system through `color-scheme`. -->
        <script>
            (function () {
                try {
                    var stored = localStorage.getItem("toto-theme");
                    if (stored === "light" || stored === "dark") {
                        document.documentElement.dataset.theme = stored;
                    }
                } catch (error) {
                    /* Private mode: fall back to the system scheme. */
                }
            })();
        </script>

        <title>toto.sg — Singapore TOTO draws, 204-strategy league & insights</title>
    </head>

    <body class="size-full bg-canvas text-ink antialiased">
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>

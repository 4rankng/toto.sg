name: verify

# Data-contract + build gate for main. `npm run league` regenerates the
# artifact deterministically, `verify:data` fails on drift (broken ranks,
# null scores, placeholder litter), and `npm run build` proves the SPA still
# compiles. A hand-edited strategies.json that violates the contract cannot
# pass this workflow.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run league

      - run: npm run verify:data

      - run: npm run build
